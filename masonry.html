    <!-- Cargar la librería de Masonry desde internet -->

    <!-- Activar Masonry con una línea -->
    <script>
        var elem = document.querySelector('.grid');
        var msnry = new Masonry(elem, {
          itemSelector: '.grid-item',
          columnWidth: 220,
          gutter: 10
        });
